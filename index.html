<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amani Notes App</title>
    <!-- Tailwind CSS CDN for instant responsive styling -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <!-- 🔑 1. AUTH PANEL: Shows if user is logged out -->
    <div id="auth-panel" class="max-w-md mx-auto mt-20 p-6 bg-gray-800 rounded-lg shadow-xl">
        <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Login to Notes API</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" id="username" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 font-semibold rounded transition">Log In</button>
        </form>
        <p id="auth-error" class="text-red-400 text-sm mt-4 text-center hidden"></p>
    </div>

    <!-- 📝 2. MAIN APP DASHBOARD: Shows if user is logged in -->
    <div id="app-dashboard" class="max-w-4xl mx-auto p-6 hidden">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-indigo-400">My Personal Notes</h1>
            <button id="logout-btn" class="px-4 py-2 bg-red-600 hover:bg-red-700 font-medium rounded transition">Logout</button>
        </div>

        <!-- Create Note Panel -->
        <div class="bg-gray-800 p-6 rounded-lg shadow-md mb-8">
            <h3 class="text-xl font-semibold mb-4 text-indigo-300">Create a New Note</h3>
            <form id="note-form" class="space-y-4">
                <input type="text" id="note-title" placeholder="Note Title" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500">
                <textarea id="note-content" placeholder="Type your note content here..." rows="3" required class="w-full p-2 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-indigo-500"></textarea>
                <button type="submit" class="px-6 py-2 bg-green-600 hover:bg-green-700 font-semibold rounded transition">Save Note</button>
            </form>
        </div>

        <!-- Notes Output Grid -->
        <div id="notes-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Notes cards will be dynamically injected here via JS -->
        </div>
    </div>

    <!-- 🧠 3. INTERACTIVE FRONTEND ENGINE (JAVASCRIPT) -->
    <script>
        const API_URL = "http://127.0.0.1:8000"; // Update to match your FastAPI server URL if different

        // Application State Selectors
        const authPanel = document.getElementById("auth-panel");
        const appDashboard = document.getElementById("app-dashboard");
        const notesGrid = document.getElementById("notes-grid");
        const authError = document.getElementById("auth-error");

        // UI Initializer Check
        function checkAuth() {
            const token = localStorage.getItem("access_token");
            if (token) {
                authPanel.classList.add("hidden");
                appDashboard.classList.remove("hidden");
                fetchNotes();
            } else {
                authPanel.classList.remove("hidden");
                appDashboard.classList.add("hidden");
            }
        }

        // 🔐 Action: Log In User
        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            authError.classList.add("hidden");

            // FastAPI OAuth2PasswordRequestForm expects URL-encoded form data, not standard JSON!
            const formData = new URLSearchParams();
            formData.append("username", document.getElementById("username").value);
            formData.append("password", document.getElementById("password").value);

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: formData
                });

                if (!response.ok) throw new Error("Invalid username or password credentials.");

                const data = await response.json();
                localStorage.setItem("access_token", data.access_token); // Secure token locally
                checkAuth();
            } catch (err) {
                authError.textContent = err.message;
                authError.classList.remove("hidden");
            }
        });

        // 🍿 Action: Fetch Current User's Notes
        async function fetchNotes() {
            const token = localStorage.getItem("access_token");
            try {
                const response = await fetch(`${API_URL}/notes`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (response.status === 401) return logout(); // Handle expired token cleanly

                const notes = await response.json();
                notesGrid.innerHTML = notes.length === 0
                    ? `<p class="text-gray-500 italic col-span-2 text-center">No notes found. Create your first one above!</p>`
                    : notes.map(note => `
                        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-md">
                            <h4 class="text-lg font-bold text-indigo-300 mb-2">${note.title}</h4>
                            <p class="text-gray-300 text-sm whitespace-pre-wrap">${note.content}</p>
                        </div>
                    `).join("");
            } catch (err) {
                console.error("Failed to load notes:", err);
            }
        }

        // ➕ Action: Post a New Note
        document.getElementById("note-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = localStorage.getItem("access_token");

            const titleInput = document.getElementById("note-title");
            const contentInput = document.getElementById("note-content");

            try {
                const response = await fetch(`${API_URL}/notes`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        title: titleInput.value,
                        content: contentInput.value
                    })
                });

                if (response.ok) {
                    titleInput.value = "";
                    contentInput.value = "";
                    fetchNotes(); // Reload layout instantly
                }
            } catch (err) {
                console.error("Error creating note:", err);
            }
        });

        // 🚪 Action: Logout User
        function logout() {
            localStorage.removeItem("access_token");
            checkAuth();
        }
        document.getElementById("logout-btn").addEventListener("click", logout);

        // Boot system check on refresh
        checkAuth();
    </script>
</body>
</html>
